name: PR6 diagnostics

on:
    push:
        branches: ["feat/home-meet-discord-flow"]

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
            - run: npm ci
            - run: npm --prefix backend ci
            - name: Emit canonical Prettier output for reviewable corrections
              shell: bash
              run: |
                  node --input-type=module <<'NODE'
                  import fs from "node:fs";
                  import prettier from "prettier";
                  for (const path of [
                    "frontend/src/main.js",
                    "frontend/src/state/events.js",
                    "frontend/src/state/store.js",
                    "frontend/src/ui/home.js",
                    "frontend/test/conversations.test.js",
                  ]) {
                    const original = fs.readFileSync(path, "utf8");
                    const config = await prettier.resolveConfig(path);
                    const formatted = await prettier.format(original, { ...config, filepath: path });
                    console.log("PR6_FORMAT:" + JSON.stringify({ path, content: formatted }));
                  }
                  NODE
            - name: Run all independent quality checks without skipping failures
              shell: bash
              run: |
                  rc=0
                  npm run check:types || rc=1
                  npm run lint:js || rc=1
                  npm run lint:css || rc=1
                  npm run build || rc=1
                  npm test || rc=1
                  exit "$rc"
