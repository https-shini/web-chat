name: CI

on:
    push:
        branches: ["main"]
    pull_request:

jobs:
    verificar:
        runs-on: ubuntu-latest
        # Least privilege: este job só lê o repositório e roda checagens —
        # nunca publica, comenta nem escreve nada. Sem este bloco, o token
        # herda a permissão padrão do repositório, que pode ser mais ampla
        # do que o job precisa.
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm

            - name: Instalar dependências
              run: npm ci

            - name: Instalar dependências do backend
              run: npm --prefix backend ci

            - name: Formatação
              run: npm run format:check

            - name: Lint do JavaScript
              run: npm run lint:js

            # Barra hex, rgb/hsl, !important e densidade fora de token nos
            # componentes. Um PR com cor no lugar errado falha aqui.
            - name: Lint do CSS
              run: npm run lint:css

            - name: Verificação de tipos
              run: npm run check:types

            # Mede os dois temas a partir de tokens.css e falha se qualquer
            # par declarado reprovar no critério que lhe cabe.
            - name: Contraste dos tokens
              run: npm run check:contrast

            - name: Build
              run: npm run build

            # Integração do protocolo (servidor real) + unidade dos dois lados,
            # incluindo o teste de contrato entre cliente e servidor.
            - name: Testes
              run: npm test

            # Bloqueante: dependências que vão para produção (o backend; o
            # frontend não tem dependência de runtime).
            - name: Auditoria de dependências de produção
              run: |
                  npm audit --omit=dev --audit-level=high
                  npm --prefix backend audit --omit=dev --audit-level=high

            # Informativa até a Fase 6 (F6-01/F6-03): as ferramentas de
            # desenvolvimento ainda têm avisos que exigem upgrade de major.
            - name: Auditoria completa (informativa)
              continue-on-error: true
              run: npm audit

    # Fluxos principais no navegador (Chromium), contra um backend PRÓPRIO
    # em 127.0.0.1 subido pelo próprio teste — nunca a produção. Nenhum
    # segredo: a chave de administração é gerada a cada execução, só em
    # memória. Falha também se um id interno do servidor aparecer no
    # navegador (quadros ou HTML) ou se houver violação séria de
    # acessibilidade (axe).
    navegador:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm

            - name: Instalar dependências
              run: |
                  npm ci
                  npm --prefix backend ci

            - name: Instalar o Chromium do Playwright
              run: npx playwright install --with-deps chromium

            - name: Testes no navegador (backend isolado)
              run: npm run test:e2e
