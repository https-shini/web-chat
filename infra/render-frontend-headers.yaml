# Blueprint mínimo: só os cabeçalhos de segurança do site estático.
#
# Espelha a configuração ATUAL do chat-frontend no Render (build, pasta
# publicada, branch, auto deploy) e acrescenta apenas `headers`. O backend
# não aparece aqui de propósito: este Blueprint não o gerencia. A
# configuração completa e revisada continua em render.yaml.
#
# O Blueprint no Render (sincronização automática desligada) lê este arquivo
# da branch `ops/render-frontend-headers`. Cópia idêntica fica na `main` para
# o teste frontend/test/headers.test.js conferir que os cabeçalhos não
# divergem do render.yaml nem do index.html.
#
# A CSP é a mesma do <meta> do index.html (mesmo hash do script de tema), com
# duas diferenças que só valem como cabeçalho HTTP: connect-src restrito ao
# backend oficial por TLS e frame-ancestors 'none'.

services:
    - type: web
      name: chat-frontend
      runtime: static
      branch: main
      buildCommand: npm install && npm run build
      staticPublishPath: dist
      autoDeployTrigger: commit
      previews:
          generation: off
      headers:
          - path: /*
            name: Content-Security-Policy
            value: "default-src 'self'; script-src 'self' 'sha256-Fi5GNExRuHFNJT41G5L8f9zpBwwJ0I4ywQTVAiJUGhs='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self' wss://chat-backend-3sxv.onrender.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
          - path: /*
            name: X-Frame-Options
            value: DENY
          - path: /*
            name: X-Content-Type-Options
            value: nosniff
          - path: /*
            name: Referrer-Policy
            value: strict-origin-when-cross-origin
          - path: /*
            name: Permissions-Policy
            value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
