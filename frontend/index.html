<!doctype html>
<html lang="pt-BR" data-theme="dark">
    <head>
        <meta charset="UTF-8" />

        <!--
            Content-Security-Policy: reduz o dano possível de um XSS mesmo
            que um apareça — script só de origem própria mais o hash exato
            do bootstrap de tema abaixo; nada de plugin, formulário só para
            a própria origem. connect-src precisa aceitar ws:/wss: de
            qualquer host porque o endereço do servidor é configurado por
            ambiente (VITE_SOCKET_URL), não é fixo em tempo de build.

            Limitação real, não escondida: entregue via <meta>, a CSP NÃO
            aplica frame-ancestors nem upgrade-insecure-requests (o padrão
            ignora essas diretivas fora de cabeçalho HTTP) — proteção contra
            clickjacking e HSTS continuam dependendo de configuração na
            camada de hospedagem, fora do alcance de um arquivo estático.
        -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' 'sha256-Fi5GNExRuHFNJT41G5L8f9zpBwwJ0I4ywQTVAiJUGhs='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self' ws: wss:; base-uri 'self'; form-action 'self'; object-src 'none';"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Sala de conversa em tempo real: única, efêmera e anônima. Nada é salvo."
        />
        <link rel="icon" href="./public/images/favicon.ico" />

        <!--
            Bootstrap de tema: escreve data-theme no <html> ANTES da primeira
            pintura. Sem isto o tema salvo chega depois do primeiro frame e o
            usuário vê um flash. Escuro é o padrão; a preferência do sistema
            só decide na primeira visita, e a escolha explícita persiste.
        -->
        <script>
            (function () {
                var theme = "dark";
                try {
                    var saved = localStorage.getItem("web-chat:theme");
                    if (saved === "light" || saved === "dark") {
                        theme = saved;
                    } else if (window.matchMedia("(prefers-color-scheme: light)").matches) {
                        theme = "light";
                    }
                } catch (error) {
                    /* localStorage bloqueado: fica no padrão escuro. */
                }
                document.documentElement.setAttribute("data-theme", theme);
            })();
        </script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Syne:wght@700;800&display=swap"
        />

        <!--
            Uma folha de entrada, e a ordem da cascata vive dentro dela:
            tokens → base → componentes. O build resolve os @import num
            arquivo só; servida crua, a página continua estilizada.
        -->
        <link rel="stylesheet" href="/src/css/index.css" />

        <title>web-chat · sala aberta</title>
    </head>
    <body>
        <a class="c-skip-link" href="#conteudo">Ir para a conversa</a>

        <div class="c-app" data-screen="entry">
            <!--
                Dois <h1>, nunca os dois no mesmo momento: o oculto sai da
                árvore de acessibilidade, então há exatamente um título de
                nível 1 exposto em cada tela.
            -->
            <header class="c-app__header" hidden>
                <div class="c-app__identity">
                    <h1 class="c-wordmark u-display u-text-xl">web-chat</h1>
                    <p class="c-connection" data-state="connecting">
                        <span class="c-connection__dot" aria-hidden="true"></span>
                        <span class="c-connection__label">conectando…</span>
                    </p>
                </div>

                <div class="c-app__aside">
                    <section class="c-people" aria-labelledby="pessoas-titulo">
                        <h2 class="c-people__title u-meta" id="pessoas-titulo">
                            <span class="c-people__count">1 pessoa</span>
                        </h2>
                        <ul class="c-people__list"></ul>
                    </section>

                    <button
                        type="button"
                        class="c-button c-button--quiet c-theme-toggle"
                        data-theme-toggle
                        aria-pressed="false"
                    >
                        <span class="c-theme-toggle__glyph" aria-hidden="true"></span>
                        <span class="c-theme-toggle__label">Mudar para tema claro</span>
                    </button>
                </div>
            </header>

            <main class="c-app__main" id="conteudo" tabindex="-1">
                <section class="c-entry" aria-labelledby="entrada-titulo">
                    <h1 class="c-entry__title u-display u-text-3xl" id="entrada-titulo">
                        Sala aberta.
                    </h1>
                    <p class="c-entry__subtitle">Ninguém sabe quem você é.</p>

                    <form class="c-entry__form" novalidate>
                        <div class="c-field">
                            <label class="c-field__label u-label" for="campo-nome">
                                Como quer ser chamado
                            </label>
                            <input
                                class="c-field__input"
                                id="campo-nome"
                                name="nome"
                                type="text"
                                maxlength="30"
                                autocomplete="nickname"
                                enterkeyhint="go"
                                aria-describedby="campo-nome-erro"
                            />
                            <p class="c-field__error" id="campo-nome-erro" role="alert"></p>
                        </div>

                        <button type="submit" class="c-button c-button--primary">Entrar</button>
                    </form>

                    <p class="c-entry__note u-meta">A conversa some quando você sai.</p>

                    <button
                        type="button"
                        class="c-button c-button--quiet c-theme-toggle c-entry__theme"
                        data-theme-toggle
                        aria-pressed="false"
                    >
                        <span class="c-theme-toggle__glyph" aria-hidden="true"></span>
                        <span class="c-theme-toggle__label">Mudar para tema claro</span>
                    </button>
                </section>

                <div class="c-room" hidden>
                    <div class="c-thread" data-state="connecting" aria-hidden="true"></div>

                    <h2 class="sr-only" id="conversa-titulo">Conversa</h2>
                    <ol
                        class="c-message-list js-scroll"
                        role="log"
                        aria-live="polite"
                        aria-relevant="additions"
                        aria-labelledby="conversa-titulo"
                    ></ol>

                    <div class="c-empty" hidden>
                        <p class="c-empty__title u-display u-text-2xl">Silêncio por enquanto.</p>
                        <p class="c-empty__body">
                            Você é a primeira pessoa aqui. Escreva a primeira linha.
                        </p>
                    </div>

                    <div class="c-failure" hidden>
                        <p class="c-failure__title u-display u-text-2xl">A conexão caiu.</p>
                        <p class="c-failure__body"></p>
                        <button type="button" class="c-button c-button--primary c-failure__retry">
                            Tentar de novo
                        </button>
                    </div>

                    <p class="c-typing" hidden>
                        <span class="c-typing__text"></span>
                        <span class="c-typing__dots" aria-hidden="true">
                            <span class="c-typing__dot"></span>
                            <span class="c-typing__dot"></span>
                            <span class="c-typing__dot"></span>
                        </span>
                    </p>
                </div>
            </main>

            <footer class="c-app__footer" hidden>
                <p class="c-composer__notice u-meta" role="status"></p>

                <form class="c-composer" novalidate>
                    <div class="c-field c-composer__field">
                        <label class="c-field__label sr-only" for="campo-mensagem">Mensagem</label>
                        <input
                            class="c-field__input"
                            id="campo-mensagem"
                            name="mensagem"
                            type="text"
                            maxlength="1000"
                            autocomplete="off"
                            enterkeyhint="send"
                        />
                    </div>
                    <button type="submit" class="c-button c-button--primary c-composer__send">
                        Enviar
                    </button>
                </form>
            </footer>
        </div>

        <div class="c-toasts"></div>

        <!-- Região de anúncio única: fila e deduplicação vivem no JS. -->
        <div class="sr-only" data-announcer role="status" aria-live="polite"></div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
